#    networks:
#      - enterprise-network

#  grafana:
#    image: grafana/grafana:latest
#    container_name: kemp-grafana
#    ports:
#      - "3001:3000"
#    environment:
#      GF_SECURITY_ADMIN_PASSWORD: admin
#      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
#      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kemp-overview.json

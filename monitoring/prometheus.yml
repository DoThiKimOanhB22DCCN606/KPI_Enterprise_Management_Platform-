global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kemp-gateway'
    static_configs:
      - targets: ['gateway-service:8080']
    metrics_path: '/actuator/prometheus'

  - job_name: 'kemp-auth'
    static_configs:
      - targets: ['auth-service:8081']
    metrics_path: '/actuator/prometheus'

  - job_name: 'kemp-kpi'
    static_configs:
      - targets: ['kpi-service:8082']
    metrics_path: '/actuator/prometheus'

  - job_name: 'kemp-goal'
    static_configs:
      - targets: ['goal-service:8083']
    metrics_path: '/actuator/prometheus'

  - job_name: 'kemp-report'

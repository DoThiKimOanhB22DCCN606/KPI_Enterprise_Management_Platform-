apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: kemp
    service: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      service: gateway
  template:
    metadata:
      labels:
        service: gateway
    spec:
      containers:
        - name: gateway-service
          image: ghcr.io/your-org/kemp-gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    service: gateway

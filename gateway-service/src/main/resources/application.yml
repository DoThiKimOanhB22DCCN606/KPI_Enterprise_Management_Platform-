server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:5175"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - SecureHeaders
        - RemoveRequestHeader=X-Powered-By
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: kpi-service
          uri: http://kpi-service:8082
          predicates:
            - Path=/v1/kpis/**, /v1/kpi-templates/**, /v1/cycles/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"

        - id: goal-service
          uri: http://goal-service:8083
          predicates:
            - Path=/v1/goals/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"

        - id: report-service
          uri: http://report-service:8084
          predicates:
            - Path=/v1/reports/**

        - id: alert-service
          uri: http://alert-service:8085
          predicates:
            - Path=/v1/alerts/**, /v1/alert-rules/**

        - id: web-bff-service
          uri: http://web-bff-service:8086
          predicates:
            - Path=/v1/bff/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@ipKeyResolver}"

        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/v1/notifications/**

        - id: analytics-service
          uri: http://analytics-service:8088
          predicates:
            - Path=/v1/analytics/**

        - id: ai-service
          uri: http://ai-service:8089
          predicates:
            - Path=/v1/ai/**

        - id: audit-service
          uri: http://audit-service:8092
          predicates:
            - Path=/v1/audit-logs/**

        - id: user-service
          uri: http://user-service:8094
          predicates:
            - Path=/v1/users/**

        - id: tenant-service
          uri: http://tenant-service:8093
          predicates:
            - Path=/v1/tenants/**

        - id: organization-service
          uri: http://organization-service:8095
          predicates:
            - Path=/v1/organizations/**

        - id: dashboard-service
          uri: http://dashboard-service:8096
          predicates:
            - Path=/v1/dashboards/**

        - id: integration-service
          uri: http://integration-service:8097
          predicates:
            - Path=/v1/integrations/**, /v1/webhooks/**, /v1/import/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true